upstream users_backend {
    server users-service:8000;
}

upstream products_backend {
    server products-service:8000;
}

upstream orders_backend {
    server orders-service:8000;
}

server {
    listen 80;
    server_name api.guitarzone.cl;

    location = /favicon.ico {
        alias /usr/src/app/static_users/favicon.ico;
        access_log off;
        log_not_found off;
    }

    location / {
        root /usr/src/app/static_users;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # USERS API
    # Importante: proxy_pass sin barra final para trabajar con FORCE_SCRIPT_NAME
    location /users-api/ {
        proxy_pass http://users_backend;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # PRODUCTS API
    location /products-api/ {
        proxy_pass http://products_backend;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # ORDERS API
    location /orders-api/ {
        proxy_pass http://orders_backend;
        proxy_set_header Cookie $http_cookie;
        proxy_pass_header Set-Cookie;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # STATIC FILES
    location /static/users/ {
        alias /usr/src/app/static_users/;
        add_header Access-Control-Allow-Origin *;
    }

    location /static/products/ {
        alias /usr/src/app/static_products/;
    }

    location /static/orders/ {
        alias /usr/src/app/static_orders/;
    }

    # MEDIA FILES
    location /media/users/ {
        alias /usr/src/app/media_users/;
    }

    location /media/products/ {
        alias /usr/src/app/media_products/;

        valid_referers none blocked server_names 
                   guitarzone.cl 
                   *.guitarzone.cl 
                   localhost 
                   127.0.0.1;

        if ($invalid_referer) {
            return 403;
        }


        add_header Access-Control-Allow-Origin *;
        
        expires 30d;
        add_header Cache-Control "public, no-transform";

    }

    location /media/orders/ {
        alias /usr/src/app/media_orders/;
    }
}