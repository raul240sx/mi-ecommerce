services:
  # -------------------
  # BASES DE DATOS
  # -------------------

  users-db:
    image: postgres
    environment:
      POSTGRES_DB: users_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    restart: always  
    volumes:
      - users_data:/var/lib/postgresql/data
    networks:
      - ecommerce_net

  products-db:
    image: postgres
    environment:
      POSTGRES_DB: products_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    restart: always
    volumes:
      - products_data:/var/lib/postgresql/data
    networks:
      - ecommerce_net

  orders-db:
    image: postgres
    environment:
      POSTGRES_DB: orders_db
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata

    restart: always
    volumes:
      - orders_data:/var/lib/postgresql/data
    networks:
      - ecommerce_net

  # -------------------
  # MICROSERVICIOS DJANGO
  # -------------------

  users-service:
    build: ./backend/users
    volumes:
      - ./backend/users/apps:/usr/src/app/apps
      - ./backend/users/users_project:/usr/src/app/users_project
      - ./backend/users/manage.py:/usr/src/app/manage.py
      - ./secrets/users:/run/secrets:ro
      - ./media/users:/usr/src/app/media
      - static_users:/usr/src/app/staticfiles
    
    restart: always      
    env_file:
      - ./backend/users/.env
    depends_on:
      - users-db
    networks:
      - ecommerce_net

  products-service:
    build: ./backend/products
    volumes:
      - ./backend/products/apps:/usr/src/app/apps
      - ./backend/products/products_project:/usr/src/app/products_project
      - ./backend/products/manage.py:/usr/src/app/manage.py
      - ./secrets/products:/run/secrets:ro
      - ./media/products:/usr/src/app/media
      - static_products:/usr/src/app/staticfiles
    
    restart: always
    env_file:
      - ./backend/products/.env
    depends_on:
      - products-db
    networks:
      - ecommerce_net

  orders-service:
    build: ./backend/orders
    volumes:
      - ./backend/orders/apps:/usr/src/app/apps
      - ./backend/orders/orders_project:/usr/src/app/orders_project
      - ./backend/orders/manage.py:/usr/src/app/manage.py
      - ./secrets/orders:/run/secrets:ro
      - ./media/orders:/usr/src/app/media
      - static_orders:/usr/src/app/staticfiles

    restart: always
    env_file:
      - ./backend/orders/.env
    depends_on:
      - orders-db
    networks:
      - ecommerce_net

# -------------------
# REDIS
# -------------------
  redis-service:
    image: redis
    restart: always
    networks:
      - ecommerce_net

# -------------------
# CELERY WORKERS
# -------------------
  users-celery:
    build: ./backend/users
    command: celery -A users_project worker -l INFO
    volumes:
      - ./backend/users/apps:/usr/src/app/apps
      - ./backend/users/users_project:/usr/src/app/users_project
      - ./secrets/users:/run/secrets:ro
      - ./media/users:/usr/src/app/media
    restart: always
    env_file:
      - ./backend/users/.env
    depends_on:
      - users-service
      - redis-service
    networks:
      - ecommerce_net

  orders-celery:
    build: ./backend/orders
    command: celery -A orders_project worker -l INFO
    volumes:
      - ./backend/orders/apps:/usr/src/app/apps
      - ./backend/orders/orders_project:/usr/src/app/orders_project
      - ./secrets/users:/run/secrets:ro
      - ./media/orders:/usr/src/app/media
    restart: always
    env_file:
      - ./backend/orders/.env
    depends_on:
      - orders-service
      - redis-service
    networks:
      - ecommerce_net



# -------------------
# NGINX Proxy
# -------------------
  nginx-api-gateway:
    image: nginx:stable_alpine
    container_name: nginx
    restart: always
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - static_users:/usr/src/app/static_users:ro
      - static_products:/usr/src/app/static_products:ro
      - static_orders:/usr/src/app/static_orders:ro
      - ./media/users:/usr/src/app/media_users:ro
      - ./media/products:/usr/src/app/media_products:ro
      - ./media/orders:/usr/src/app/media_orders:ro

    depends_on:
      - users-service
      - products-service
      - orders-service

    networks:
      - ecommerce_net


  tunnel-cloudflare:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - ecommerce_net




# -------------------
# VOLUMENES Y REDES
# -------------------
volumes:
  users_data:
  products_data:
  orders_data:
  static_users:
  static_products:
  static_orders:

networks:
  ecommerce_net:
    driver: bridge
